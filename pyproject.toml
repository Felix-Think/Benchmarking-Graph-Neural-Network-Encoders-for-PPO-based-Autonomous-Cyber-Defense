[project]
name = "benchmarking-graph-neural-network-encoders-for-ppo-based-autonomous-cyber-defense-under-partial-observability"
version = "0.1.0"
description = "Matched flat and graph PPO encoder benchmarks for autonomous cyber defense in CybORG"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
    "cyborg",
    "numpy==1.26.4",
    "protobuf==4.25.3",
    "tensorboard==2.15.2",
    "torch==2.2.0",
    "torch-geometric==2.5.0",
    "tqdm==4.66.4",
]

[dependency-groups]
dev = [
    "ipykernel==6.29.5",
    "pytest==8.0.0",
    "ruff==0.5.5",
]

[tool.uv.sources]
cyborg = { path = "CybORG" }

[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
